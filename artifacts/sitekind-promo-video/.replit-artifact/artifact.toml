kind = "video"
previewPath = "/sitekind-promo-video/"
title = "Sitekind Promo Video"
version = "1.0.0"
id = "artifacts/sitekind-promo-video"
router = "path"

[[services]]
name = "web"
paths = [ "/sitekind-promo-video/" ]
localPort = 21612

[services.development]
run = "pnpm --filter @workspace/sitekind-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sitekind-promo-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/sitekind-promo-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21612"
BASE_PATH = "/sitekind-promo-video/"
