kind = "mobile"
previewPath = "/mobile/"
title = "Sitekind Mobile"
version = "1.0.0"
id = "artifacts/sitekind-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18500

[services.development]
run = "pnpm --filter @workspace/sitekind-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sitekind-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sitekind-mobile", "run", "serve" ]

[services.env]
PORT = "18500"
BASE_PATH = "/mobile/"
